packages:
  - apps/*
  - packages/*

# pnpm 12 refuses to run dependency install scripts unless each is listed here. Neither of
# these needs its script: esbuild ships its binary as an optional dependency, and
# unrs-resolver's script only falls back to WASM when the native binary is missing.
# Declining them means `pnpm install` executes no third-party code on this machine or in CI.
allowBuilds:
  esbuild: false
  # bullmq → msgpackr → optional native accelerator; msgpackr falls back to pure JS without it.
  msgpackr-extract: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - eslint@10.11.0
